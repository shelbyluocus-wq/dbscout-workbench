[package]
name = "dbscout-workbench"
version = "0.1.83"
description = "Blackcat - a desktop database workbench"
edition = "2021"

[lib]
name = "dbscout_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dbscout-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
encoding_rs = "0.8"
fontdb = "0.23"
futures-util = "0.3"
rfd = "0.17.2"
roxmltree = "0.20"
reqwest = { version = "0.13.3", features = ["json"] }
rust_xlsxwriter = "0.96"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "sqlite"] }
mongodb = { version = "3.3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "io-std", "net", "rt", "time", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow", "NSView", "NSButton", "NSControl", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.55"
