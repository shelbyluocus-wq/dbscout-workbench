[package]
name = "dbscout-workbench"
version = "0.1.32"
description = "黑猫 - 一款专注于 MySQL 数据库读写的中文桌面工作台"
authors = ["Louis"]
edition = "2021"

[lib]
name = "dbscout_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dbscout-workbench"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
fontdb = "0.23"
futures-util = "0.3"
rfd = "0.17.2"
reqwest = { version = "0.13.3", features = ["json"] }
rust_xlsxwriter = "0.96"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "sqlite"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "process", "io-util", "io-std", "net", "rt", "time", "fs", "macros"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "7.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
